<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Replio — Прототип</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #f4f5f7; }
        
        .sidebar { width: 240px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
        .brand { padding: 18px 20px; font-weight: 600; font-size: 19px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e5e7eb; letter-spacing: -0.01em; }
        .brand-mark { width: 28px; height: 28px; background: #111827; color: #fff; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
        .nav { padding: 10px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 15.5px; cursor: pointer; margin-bottom: 2px; color: #374151; font-weight: 500; text-decoration: none; transition: 0.15s; }
        .nav-item:hover { background: #f3f4f6; color: #111827; }
        .nav-item.active { background: #eef2ff; color: #4f46e5; font-weight: 600; }
        .nav-item .count { margin-left: auto; background: #ef4444; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 600; line-height: 1.4; }
        .sidebar-bottom { padding: 14px; border-top: 1px solid #e5e7eb; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #ddd6fe; color: #5b21b6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
        .user-meta strong { font-size: 14.5px; display: block; font-weight: 600; line-height: 1.2; }
        .user-meta small { color: #6b7280; font-size: 12.5px; }
        
        .iframe-container { flex: 1; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><span class="brand-mark">r</span><span>replio</span></div>
        <nav class="nav" id="nav">
            <a href="#reviews" class="nav-item" data-page="reviews">💬 Отзывы <span class="count">3052</span></a>
            <a href="#returns" class="nav-item" data-page="returns">↩️ Возвраты <span class="count">22</span></a>
            <a href="#chats" class="nav-item" data-page="chats">💭 Чаты <span class="count">3341</span></a>
            <a href="#questions" class="nav-item" data-page="questions">❓ Вопросы <span class="count">18</span></a>
            <a href="#analytics" class="nav-item" data-page="analytics" style="opacity: 0.5; pointer-events: none;">📈 Аналитика</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="avatar">ЕГ</div>
            <div class="user-meta"><strong>Егор Г.</strong><small>ЛПР · Техника</small></div>
        </div>
    </aside>

    <div class="iframe-container">
        <iframe id="app-frame" src="reviews.html"></iframe>
    </div>

    <script>
        const frame = document.getElementById('app-frame');
        const nav = document.getElementById('nav');

        function loadPage(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeLink = document.querySelector(`[data-page="${page}"]`);
            if (activeLink) activeLink.classList.add('active');
            frame.src = page + '.html';
        }

        frame.onload = function() {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                // Внедряем стили, перебивающие всё остальное
                const style = doc.createElement('style');
                style.textContent = `
                    .sidebar { display: none !important; }
                    .main, .app-content { width: 100% !important; flex: 1 !important; min-width: 0 !important; margin-left: 0 !important; }
                    .app, .app-shell { display: flex !important; height: 100vh !important; overflow: hidden !important; }
                `;
                doc.head.appendChild(style);
            } catch (e) {
                console.warn('Локальный доступ к iframe заблокирован браузером. Загрузите на GitHub.');
            }
        };

        function handleHash() {
            const hash = window.location.hash.replace('#', '') || 'reviews';
            loadPage(hash);
        }

        window.addEventListener('hashchange', handleHash);
        handleHash();
    </script>
</body>
</html>
